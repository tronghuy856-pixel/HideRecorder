name: Build HideRecorder APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/hiderecorder/app
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.hiderecorder.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hiderecorder.app"
                  minSdk 34
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/resources/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="HideRecorder"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/hiderecorder/app/MainActivity.kt
          package com.hiderecorder.app

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionConfig
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private val REQUEST_CODE = 1000

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val button = Button(this).apply {
                      text = "Bắt đầu quay 1 App (Ẩn Hack)"
                      textSize = 18f
                      setOnClickListener { startSingleAppRecording() }
                  }
                  setContentView(button)
              }

              private fun startSingleAppRecording() {
                  val projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      projectionManager.createScreenCaptureIntent(
                          MediaProjectionConfig.createConfigForUserChoice()
                      )
                  } else {
                      projectionManager.createScreenCaptureIntent()
                  }
                  startActivityForResult(intent, REQUEST_CODE)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode: Int, resultCode: Int, data: Intent?)
                  if (requestCode == REQUEST_CODE && resultCode == Activity.RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, ScreenCaptureService::class.java).apply {
                          putExtra("RESULT_CODE", resultCode)
                          putExtra("DATA_INTENT", data)
                      }
                      startForegroundService(serviceIntent)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/hiderecorder/app/ScreenCaptureService.kt
          package com.hiderecorder.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.MediaRecorder
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class ScreenCaptureService : Service() {
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var mediaRecorder: MediaRecorder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  val notification: Notification = NotificationCompat.Builder(this, "CHANNEL_ID")
                      .setContentTitle("HideRecorder")
                      .setContentText("Đang quay ứng dụng...")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build()
                  startForeground(1, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val resultCode = intent?.getIntExtra("RESULT_CODE", -1) ?: -1
                  val dataIntent = intent?.getParcelableExtra<Intent>("DATA_INTENT")

                  if (resultCode != -1 && dataIntent != null) {
                      val projectionManager = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      mediaProjection = projectionManager.getMediaProjection(resultCode, dataIntent)
                      setupMediaRecorder()
                      createVirtualDisplay()
                      mediaRecorder?.start()
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      mediaRecorder?.stop()
                      mediaRecorder?.release()
                      virtualDisplay?.release()
                      mediaProjection?.stop()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun setupMediaRecorder() {
                  mediaRecorder = MediaRecorder().apply {
                      setVideoSource(MediaRecorder.VideoSource.SURFACE)
                      setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      setVideoEncoder(MediaRecorder.VideoEncoder.H264)
                      setVideoSize(1080, 1920)
                      setVideoFrameRate(60)
                      setVideoEncodingBitRate(10000000)
                      setOutputFile("${externalCacheDir?.absolutePath}/recorded_game.mp4")
                      prepare()
                  }
              }

              private fun createVirtualDisplay() {
                  virtualDisplay = mediaProjection?.createVirtualDisplay(
                      "GameCapture",
                      1080, 1920, 420,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      mediaRecorder?.surface,
                      null, null
                  )
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel("CHANNEL_ID", "Screen Capture", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HideRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
